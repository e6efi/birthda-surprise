<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة جداً! 🎁✨</title>
    <!-- مكتبة الألعاب النارية الاحترافية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* 🌌 خلفية السماء والنجوم المتلألئة */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 8px #fff; }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 90%;
            max-width: 500px;
        }

        /* 🎁 صندوق الهدية ثلاثي الأبعاد */
        .gift-container {
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .gift-box {
            position: relative;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(255, 65, 108, 0.45);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            animation: float 3s ease-in-out infinite;
        }

        .gift-box:hover {
            transform: scale(1.08) rotateY(10deg);
        }

        .gift-lid {
            position: absolute;
            top: -15px;
            left: -10px;
            width: 160px;
            height: 40px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2;
        }

        .ribbon-v {
            position: absolute;
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, #ffd700, #fff8dc, #ffd700);
            left: 50%;
            transform: translateX(-50%);
        }

        .ribbon-h {
            position: absolute;
            width: 100%;
            height: 25px;
            background: linear-gradient(to bottom, #ffd700, #fff8dc, #ffd700);
            top: 50%;
            transform: translateY(-50%);
        }

        .gift-container.open .gift-lid {
            transform: translateY(-120px) rotate(-25deg) scale(0.8);
            opacity: 0;
        }

        .gift-container.open .gift-box {
            animation: none;
            transform: scale(0);
            opacity: 0;
            transition: all 0.5s ease 0.3s;
        }

        .hint-text {
            font-size: 1.15rem;
            color: #ffd700;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            animation: pulse 1.5s infinite;
        }

        /* 📜 بطاقة التهنئة العصرية */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 100%;
            animation: popup 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .card h1 {
            font-size: 2.1rem;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .typed-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #f0f0f0;
            min-height: 120px;
        }

        .floating-element {
            position: absolute;
            top: -10%;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fall {
            to {
                transform: translateY(115vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- 🌌 خلفية النجوم -->
    <div class="stars" id="starsContainer"></div>

    <!-- 🎵 عنصر الصوت/الموسيقى -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-442.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- الهدية -->
        <div id="giftContainer" class="gift-container" onclick="openSurprise()">
            <div class="gift-box">
                <div class="gift-lid">
                    <div class="ribbon-v"></div>
                </div>
                <div class="ribbon-v"></div>
                <div class="ribbon-h"></div>
            </div>
        </div>
        <p id="hint" class="hint-text">✨ إلمس الهدية لاكتشاف المفاجأة ✨</p>

        <!-- كرت الرسالة -->
        <div id="card" class="card">
            <h1>🌸 عيد ميلاد سعيد! 🌸</h1>
            <p id="typedText" class="typed-text"></p>
        </div>
    </div>

    <script>
        // إنشاء السماء والنجوم تلقائياً عند فتح الصفحة
        function createStars() {
            const starsContainer = document.getElementById('starsContainer');
            const starCount = 80;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                starsContainer.appendChild(star);
            }
        }
        createStars();

        const messageText = "في هذا اليوم المميز جداً، أتمنى لك سنة جديدة مليئة بالسعادة والنجاحات واللحظات الجميلة التي تشبه قلبك. 💖\n\nكل عام وأنت بألف خير وصحة وأمل! 🎆✨";

        function openSurprise() {
            const giftContainer = document.getElementById('giftContainer');
            const hint = document.getElementById('hint');
            const card = document.getElementById('card');
            const music = document.getElementById('bgMusic');

            // 🎶 تشغيل الموسيقى فور الضغط
            music.play().catch(e => console.log("Music play blocked", e));

            // أنيميشن الفتح
            giftContainer.classList.add('open');
            hint.style.display = 'none';

            setTimeout(() => {
                giftContainer.style.display = 'none';
                card.style.display = 'block';
                
                // التأثيرات
                launchFireworks();
                startFloatingElements();
                typeWriter(messageText, 'typedText', 50);

            }, 800);
        }

        function typeWriter(text, elementId, speed) {
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';

            function type() {
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        elem.innerHTML += '<br>';
                    } else {
                        elem.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function launchFireworks() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff416c', '#ffd700', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff416c', '#ffd700', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        function startFloatingElements() {
            const elements = ['🌸', '🌹', '💖', '✨', '🌷', '🎈', '⭐'];
            
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('floating-element');
                el.innerText = elements[Math.floor(Math.random() * elements.length)];
                
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = Math.random() * 3 + 3 + 's';
                el.style.fontSize = Math.random() * 15 + 20 + 'px';
                el.style.opacity = Math.random();
                
                document.body.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
