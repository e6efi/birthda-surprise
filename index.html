<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعدي الذكي الشخصي 🤖✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; color: #f8fafc;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px 10px;
        }

        .container { width: 100%; max-width: 600px; }

        .card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px); border-radius: 20px;
            padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }

        textarea {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 1px solid #334155; background: #0f172a; color: #fff;
            font-size: 1rem; margin-bottom: 12px; outline: none; font-family: inherit;
            resize: vertical;
        }
        textarea:focus { border-color: #38bdf8; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: bold; cursor: pointer; color: #fff;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            transition: transform 0.2s, background 0.2s; margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.98); }

        .result-box {
            background: #090d16; border: 1px solid #334155; border-radius: 12px;
            padding: 16px; text-align: right; min-height: 140px; margin: 15px 0;
            white-space: pre-line; line-height: 1.7; color: #f1f5f9; font-size: 1rem;
            max-height: 400px; overflow-y: auto;
        }

        .loader {
            display: none; margin: 15px 0; color: #38bdf8; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🤖 الكاتب الذكي الشخصي</h1>
            <p>اكتب أي سؤال، طلب، أو نص تحتاجه وسيُجيبك الذكاء الاصطناعي بدقة وبدون أي قيود!</p>

            <textarea id="userInput" rows="4" placeholder="اطلب أي شيء هنا... (مثلاً: اكتب لي مقالاً عن، أو خصّص لي خطة، أو اكتب إعلاناً لـ...)"></textarea>

            <button class="btn" onclick="askAi()">🚀 إرسال للذكاء الاصطناعي</button>

            <div id="loader" class="loader">⏳ جاري التفكير والكتابة...</div>
            
            <div id="resultArea" style="display: none;">
                <div id="outputBox" class="result-box"></div>
                <button class="btn" onclick="copyText()" style="background: #334155;">📋 نسخ النص</button>
            </div>
        </div>
    </div>

    <script>
        async function askAi() {
            const prompt = document.getElementById('userInput').value.trim();
            if (!prompt) return alert("يرجى كتابة سؤالك أو طلبك أولاً!");

            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const outputBox = document.getElementById('outputBox');

            resultArea.style.display = 'block';
            loader.style.display = 'block';
            outputBox.innerText = '';

            try {
                // إرسال الطلب لمحرك الذكاء الاصطناعي
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const textResult = await response.text();

                loader.style.display = 'none';
                outputBox.innerText = textResult;

            } catch (error) {
                loader.style.display = 'none';
                outputBox.innerText = "❌ حدث خطأ أثناء الاتصال بالذكاء الاصطناعي، يرجى إعادة المحاولة.";
            }
        }

        function copyText() {
            const text = document.getElementById('outputBox').innerText;
            navigator.clipboard.writeText(text);
            alert("📋 تم نسخ النص بنجاح!");
        }
    </script>
</body>
</html>
